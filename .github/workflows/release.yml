name: release
# يُنشأ الإصدار تلقائيًّا حين يُضاف ملف ملاحظات جديد في releases/vX.Y.Z.md
on:
  push:
    branches: [main]
    paths: ["releases/v*.md"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "tag=$(ls releases/v*.md | sed 's#releases/##; s#\.md$##' | sort -V | tail -1)" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "العربية ${{ steps.v.outputs.tag }}"
          body_path: releases/${{ steps.v.outputs.tag }}.md
          make_latest: true
          files: |
            arabiyya.mcpb
            releases/sarf-windows.zip
            install_sarf.command
