name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          name: "العربية ${{ github.ref_name }}"
          body_path: releases/${{ github.ref_name }}.md
          files: |
            arabiyya.mcpb
            releases/sarf-windows.zip
            install_sarf.command
